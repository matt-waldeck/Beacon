<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homelab</title>
<script>try{var t=localStorage.getItem("theme");if(t&&t!=="auto")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{color-scheme:light;--ink:#17212b;--paper:#f3f5f7;--rule:#cbd3db;--grid:rgba(0,0,0,.08);--field:#fff;--blue:#0a5bd6;--on-blue:#fff;--amber:#c26a00;--red:#b3261e;--mute:#5b6875}
:root[data-theme="dark"]{color-scheme:dark;--ink:#e6ebf0;--paper:#12171d;--rule:#2d3742;--grid:rgba(255,255,255,.1);--field:#1b232c;--blue:#6ea8ff;--on-blue:#0b1a30;--amber:#f0a24b;--red:#ff8a80;--mute:#9aa7b4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--ink:#e6ebf0;--paper:#12171d;--rule:#2d3742;--grid:rgba(255,255,255,.1);--field:#1b232c;--blue:#6ea8ff;--on-blue:#0b1a30;--amber:#f0a24b;--red:#ff8a80;--mute:#9aa7b4}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1500px;margin:0 auto;padding:1rem 1.5rem 6rem}
header{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.5rem;padding-bottom:1rem}
h1{font-size:1.3rem;margin:0;letter-spacing:-.01em}
nav{display:flex;gap:.25rem}
nav button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--mute)}
nav button[aria-current=page]{color:var(--ink);border-color:var(--blue)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin-left:auto;color:var(--mute)}
input,select,button{font:inherit;padding:.35rem .6rem;border:1px solid var(--rule);border-radius:4px;background:var(--field);color:var(--ink)}
button{cursor:pointer}
.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#settings{position:relative}
#settings summary{font:inherit;padding:.35rem .6rem;border:1px solid var(--rule);border-radius:4px;background:var(--field);color:var(--ink);cursor:pointer;list-style:none}
#settings summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:calc(100% + .5rem);z-index:10;width:min(22rem,calc(100vw - 3rem));display:grid;gap:.9rem;padding:1rem;background:var(--field);border:1px solid var(--rule);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.menu label{display:flex;justify-content:space-between;align-items:center;gap:1rem;color:var(--ink)}
.menu .row{display:flex;justify-content:space-between;align-items:center;gap:.75rem}
.menu .row label{justify-content:flex-start;gap:.5rem}
.menu .chk{justify-content:flex-start}
.menu input{width:5rem}.menu .chk input{width:auto}
#grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:60px;gap:12px;position:relative}
.tile{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;overflow:hidden;container-type:inline-size;background:var(--field);border:1px solid var(--rule);border-radius:6px}
.th{display:flex;justify-content:space-between;align-items:center;gap:.5rem;min-height:2.4rem;padding:.3rem .75rem;border-bottom:1px solid var(--rule)}
.title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{font-weight:400;color:var(--mute);margin-left:.5rem}
.tb{display:none;gap:.25rem}
.editing .tb{display:flex}.editing .th{cursor:grab;touch-action:none}
.tb button{padding:.05rem .45rem}
.body{flex:1;min-height:0;overflow:auto;padding:.75rem}
.t-app .th{display:none}.editing .t-app .th{display:flex}
.rs{display:none;position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;border:solid var(--blue);border-width:0 3px 3px 0;border-radius:0 0 6px 0}
.editing .rs{display:block}
.ghost{border:2px dashed var(--blue);border-radius:6px;background:color-mix(in srgb,var(--blue) 14%,transparent);pointer-events:none}
.lift{z-index:5;opacity:.85;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.editing .tile a{pointer-events:none}
form.cfg{position:absolute;inset:0;z-index:2;display:grid;align-content:start;gap:.5rem;padding:.75rem;overflow:auto;background:var(--field)}
form.cfg[hidden]{display:none}
form.cfg label{display:grid;gap:.15rem;color:var(--mute)}
form.cfg input{width:100%}
.err,.bad{color:var(--red)}.bad{font-weight:600}.mute{color:var(--mute)}
.dev{display:grid;grid-template-columns:11rem 1fr 1fr;gap:1rem;height:100%}
.ch{position:relative;min-width:0;min-height:0}
@container(max-width:560px){.dev{grid-template-columns:1fr;grid-auto-rows:minmax(160px,auto);height:auto}}
dl{display:grid;grid-template-columns:auto 1fr;gap:.2rem .75rem;margin:0}
dt{color:var(--mute)}dd{margin:0}dt.sub{padding-left:1rem}
.sum{display:flex;flex-wrap:wrap;gap:.75rem 2rem}
.tot small{display:block;color:var(--mute)}
.tot b{font-size:1.6rem;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.app{display:grid;place-content:center;gap:.25rem;height:100%;text-align:center;color:inherit;text-decoration:none}
.app .ic{font-size:2.2rem;line-height:1}
</style></head>
<body><main>
<header><h1>Homelab</h1>
<nav id="tabs"><button data-t="home">Home</button><button data-t="network">Network</button><button data-t="servers">Servers</button><button data-t="apps">Apps</button></nav>
<div class="ctl"><span id="stamp"></span>
<select id="add" hidden></select>
<button id="edit">Edit layout</button>
<details id="settings"><summary>Settings</summary>
<div class="menu">
<div class="row"><label>Refresh every <input id="iv" type="number" min="5" max="3600"> seconds</label><button id="save" class="pri">Save</button></div>
<label>Show last <select id="range"><option value="15">15 minutes</option><option value="60" selected>1 hour</option><option value="360">6 hours</option><option value="1440">24 hours</option></select></label>
<label>Theme <select id="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
<label class="chk"><input type="checkbox" id="bands"> Split client counts by band (2.4 / 5 / 6 GHz)</label>
<small id="ver" class="mute"></small>
</div></details></div></header>
<p id="none" class="mute" hidden></p>
<div id="grid"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const COLS = 12, TABS = ["home", "network", "servers", "apps"], BANDS = ["2.4", "5", "6"];
const NAMES = {network: "Network", servers: "Servers", apps: "Apps"};
const FIELDS = {device: [["name", "Name"], ["host", "IP or hostname"]], app: [["name", "Name"], ["url", "URL (https://…)"], ["icon", "Icon (emoji)"]]};
const DEF = {
  home: () => [{id: uid(), type: "summary", ref: "network", x: 0, y: 0, w: 6, h: 3}, {id: uid(), type: "summary", ref: "servers", x: 6, y: 0, w: 3, h: 3}, {id: uid(), type: "summary", ref: "apps", x: 9, y: 0, w: 3, h: 3}],
  network: () => [{id: uid(), type: "summary", ref: "network", x: 0, y: 0, w: 12, h: 2}],
};
let D = {}, DATA = {devices: []}, tab = "home", edit = false, iv = 30, timer, st, bandsOn = false;
const els = {};
const uid = () => Math.random().toString(36).slice(2, 8);
const tiles = () => D.tabs[tab] ||= [];
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const esc = t => String(t ?? "–").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const g = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const bps = b => b == null ? "–" : b >= 1e6 ? (b / 1e6).toFixed(1) + " Mbps" : Math.round(b / 1e3) + " kbps";
const pct = v => v + "%";
const up = s => { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}d ${h}h` : `${h}h ${m}m`; };

async function api(method, url, body) {
  const r = await fetch(url, {method, headers: {"Content-Type": "application/json"}, body: body && JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Request failed");
  return j;
}
const clean = () => ({apps: D.apps, tabs: Object.fromEntries(Object.entries(D.tabs).map(([k, v]) => [k, v.filter(t => !t.new)]))});
const save = () => { clearTimeout(st); st = setTimeout(() => api("PUT", "/api/dash", clean()).catch(() => {}), 300); };

// ---- grid: 12 columns, tiles fall upward until they rest on another tile ----
const hit = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
function place(T, pin) {
  const done = pin ? [pin] : [];
  T.filter(t => t !== pin).sort((a, b) => a.y - b.y || a.x - b.x).forEach(t => {
    while (done.some(o => hit(o, t))) t.y++;
    while (t.y > 0 && !done.some(o => hit(o, {...t, y: t.y - 1}))) t.y--;
    done.push(t);
  });
}

function drag(e, t, el, mode) {
  if (e.button) return;
  e.preventDefault();
  const gr = $("#grid"), cw = (gr.getBoundingClientRect().width + 12) / COLS, ox = e.clientX, oy = e.clientY, o = {x: t.x, y: t.y, w: t.w, h: t.h};
  const ghost = document.createElement("div"); ghost.className = "ghost"; gr.append(ghost);
  const show = p => { ghost.style.gridColumn = `${p.x + 1} / span ${p.w}`; ghost.style.gridRow = `${p.y + 1} / span ${p.h}`; };
  let p = {...o}; show(p);
  if (mode === "move") el.classList.add("lift");
  const mv = ev => {
    const dx = Math.round((ev.clientX - ox) / cw), dy = Math.round((ev.clientY - oy) / 72);
    p = mode === "move" ? {...o, x: Math.max(0, Math.min(COLS - o.w, o.x + dx)), y: Math.max(0, o.y + dy)}
                        : {...o, w: Math.max(2, Math.min(COLS - o.x, o.w + dx)), h: Math.max(2, o.h + dy)};
    show(p);
    if (mode === "move") el.style.transform = `translate(${ev.clientX - ox}px, ${ev.clientY - oy}px)`;
  };
  addEventListener("pointermove", mv);
  addEventListener("pointerup", () => {
    removeEventListener("pointermove", mv); ghost.remove();
    Object.assign(t, p); place(tiles(), t); save(); renderGrid();
  }, {once: true});
}

// ---- tiles ----
const mk = (el, sets, max, fmt) => new Chart(el, {type: "line",
  data: {labels: [], datasets: sets.map(([label, c]) => ({label, borderColor: c, borderWidth: 1.5, pointRadius: 0, tension: .25, data: []}))},
  options: {animation: false, maintainAspectRatio: false, interaction: {mode: "index", intersect: false},
    scales: {x: {ticks: {maxTicksLimit: 5}}, y: {beginAtZero: true, max, ticks: {callback: fmt}}},
    plugins: {legend: {labels: {boxWidth: 10}}, tooltip: {callbacks: {label: c => `${c.dataset.label}: ${fmt(c.parsed.y)}`}}}}});
const upd = (c, labels, ...sets) => { c.data.labels = labels; sets.forEach((s, i) => c.data.datasets[i].data = s); c.update(); };

function build(t) {
  const el = document.createElement("section");
  el.className = "tile t-" + t.type; el.dataset.k = tab + t.id;
  el.innerHTML = `<div class="th"><span class="title"></span><span class="tb"><button class="mv" aria-label="Move">⠿</button><button class="cf" aria-label="Configure">⚙</button><button class="rm" aria-label="Remove">✕</button></span></div><div class="body"></div><i class="rs"></i><form class="cfg" hidden></form>`;
  el.body = el.querySelector(".body"); el.ttl = el.querySelector(".title");
  if (t.type === "device") {
    el.body.innerHTML = `<div class="dev"><div class="f"></div><div class="ch"><canvas></canvas></div><div class="ch"><canvas></canvas></div></div>`;
    const [a, b] = el.body.querySelectorAll("canvas");
    el.ch = {use: mk(a, [["CPU", g("--blue")], ["Memory", g("--amber")]], 100, pct), net: mk(b, [["Received", g("--blue")], ["Sent", g("--amber")]], undefined, bps)};
  }
  if (t.type === "app") el.body.innerHTML = `<a class="app" target="_blank" rel="noopener"><span class="ic"></span><b></b></a>`;
  el.querySelector(".th").onpointerdown = e => edit && !e.target.closest(".cf,.rm") && drag(e, t, el, "move");
  el.querySelector(".rs").onpointerdown = e => drag(e, t, el, "size");
  el.querySelector(".cf").onclick = () => openCfg(t, el);
  el.querySelector(".rm").onclick = () => remove(t);
  if (!FIELDS[t.type]) el.querySelector(".cf").hidden = true;
  return el;
}

const bandRows = b => bandsOn && b ? BANDS.filter(k => b[k] != null).map(k => `<dt class="sub">${k} GHz</dt><dd>${b[k]}</dd>`).join("") : "";
function facts(d) {
  const s = d.series, last = s.at(-1) || {}, info = [...s].reverse().find(x => x.model) || {};
  if (!s.length) return "<p>Waiting for first sample…</p>";
  if (last.error) return `<p class="bad">Unreachable: ${esc(last.error)}</p>`;
  return `<dl><dt>Model</dt><dd>${esc(info.model)}</dd><dt>Firmware</dt><dd>${esc(info.version)}</dd>
    <dt>Uptime</dt><dd>${last.uptime ? up(last.uptime) : "–"}</dd>${last.clients != null ? `<dt>Clients</dt><dd>${last.clients}</dd>` + bandRows(last.bands) : ""}
    <dt>Load</dt><dd>${esc(last.load)}</dd>${last.poe != null ? `<dt>PoE draw</dt><dd>${last.poe} W</dd>` : ""}</dl>`;
}

function netTiles() {  // latest sample of every reachable device; a tile shows only if some device reports it
  const t = {poe: null, clients: null, rx: null, tx: null}, bands = {}, n = DATA.devices.length;
  let on = 0;
  for (const d of DATA.devices) {
    const l = d.series.at(-1);
    if (!l || l.error) continue;
    on++;
    for (const k in t) if (l[k] != null) t[k] = (t[k] ?? 0) + l[k];
    for (const k in l.bands) bands[k] = (bands[k] ?? 0) + l.bands[k];
  }
  const split = bandsOn ? BANDS.filter(k => bands[k] != null).map(k => `${k} GHz ${bands[k]}`).join(" · ") : "";
  return [["Devices online", `${on} of ${n}`], ["PoE draw", t.poe, v => v.toFixed(1) + " W"], ["Clients", t.clients, null, split],
          ["Throughput received", t.rx, bps], ["Throughput sent", t.tx, bps]]
    .filter(x => x[1] != null)
    .map(([l, v, f, d]) => `<div class="tot"><small>${l}</small><b>${f ? f(v) : v}</b>${d ? `<small>${d}</small>` : ""}</div>`).join("");
}
const SUM = {
  network: () => `<div class="sum">${netTiles()}</div>`,
  servers: () => `<p class="mute">Server monitoring is planned for a later release.</p>`,
  apps: () => `<div class="sum"><div class="tot"><small>Apps</small><b>${Object.keys(D.apps).length}</b></div></div>`,
};

function update(t, el) {
  if (t.type === "device") {
    const d = DATA.devices.find(x => x.name === t.ref);
    el.ttl.innerHTML = `${esc(t.ref || "New device")}<small>${d ? esc(d.host) : ""}</small>`;
    if (!d) return;
    const ok = d.series.filter(x => !x.error);
    const lab = ok.map(x => new Date(x.ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"}));
    el.querySelector(".f").innerHTML = facts(d);
    upd(el.ch.use, lab, ok.map(x => x.cpu), ok.map(x => x.mem));
    upd(el.ch.net, lab, ok.map(x => x.rx), ok.map(x => x.tx));
  } else if (t.type === "summary") {
    el.ttl.textContent = NAMES[t.ref]; el.body.innerHTML = SUM[t.ref]();
  } else if (t.type === "app") {
    const a = D.apps[t.ref] || {}, l = el.body.firstChild;
    if (/^https?:\/\//i.test(a.url || "")) l.href = a.url; else l.removeAttribute("href");
    l.children[0].textContent = a.icon || (a.name || "?")[0];
    l.children[1].textContent = el.ttl.textContent = a.name || "New app";
  }
}

function kill(k, x) {  // remove tile x from tab k
  const key = k + x.id, el = els[key];
  if (el) { el.ch?.use.destroy(); el.ch?.net.destroy(); el.remove(); delete els[key]; }
  D.tabs[k] = D.tabs[k].filter(y => y !== x);
}

function renderGrid() {
  const gr = $("#grid"), T = tiles(), keep = new Set(T.map(t => tab + t.id));
  gr.querySelectorAll(".tile").forEach(c => keep.has(c.dataset.k) || c.remove());
  T.forEach(t => {
    const el = els[tab + t.id] ||= build(t);
    el.style.gridColumn = `${t.x + 1} / span ${t.w}`; el.style.gridRow = `${t.y + 1} / span ${t.h}`;
    el.style.transform = ""; el.classList.remove("lift");
    if (el.parentNode !== gr) gr.append(el);
    update(t, el);
  });
  $("#none").hidden = T.length > 0;
  $("#none").textContent = tab === "servers" ? "Server monitoring is planned for a later release." : "Nothing here yet. Choose Edit layout, then + Add tile.";
}

// ---- in-place configuration ----
function openCfg(t, el) {
  const f = el.querySelector("form"), F = FIELDS[t.type];
  const cur = t.type === "device" ? {name: t.ref, host: DATA.devices.find(d => d.name === t.ref)?.host} : D.apps[t.ref] || {};
  f.innerHTML = F.map(([k, l]) => `<label>${l}<input name="${k}" value="${esc(cur[k] ?? "")}"></label>`).join("")
    + `<span class="err"></span><div><button class="pri">Save</button> <button type="button" class="x">Cancel</button></div>`;
  f.hidden = false;
  f.onsubmit = async e => {
    e.preventDefault();
    try { await saveCfg(t, Object.fromEntries(new FormData(f))); f.hidden = true; } catch (x) { f.querySelector(".err").textContent = x.message; }
  };
  f.querySelector(".x").onclick = () => { f.hidden = true; if (t.new) remove(t); };
  f.elements[0].focus();
}

async function saveCfg(t, v) {
  if (t.type === "device") {
    await api(t.ref ? "PUT" : "POST", t.ref ? "/api/devices/" + encodeURIComponent(t.ref) : "/api/devices", v);
    t.ref = v.name.trim().slice(0, 60);
    setTimeout(load, 5000);
  } else {
    D.apps[t.ref] = {name: v.name.trim() || "App", url: v.url.trim(), icon: v.icon.trim().slice(0, 4)};
  }
  delete t.new; save(); fillAdd(); load();
}

async function remove(t) {
  try {
    if (!t.new && t.type === "device") {
      if (!confirm(`Remove ${t.ref} and its history?`)) return;
      await api("DELETE", "/api/devices/" + encodeURIComponent(t.ref));
    }
    if (t.type === "app" && tab === "apps") {  // the Apps tab is the catalog: removing here removes it everywhere
      if (!t.new && !confirm(`Remove ${D.apps[t.ref]?.name} from every tab?`)) return;
      for (const k in D.tabs) D.tabs[k].filter(x => x.type === "app" && x.ref === t.ref).forEach(x => kill(k, x));
      delete D.apps[t.ref];
    } else kill(tab, t);
    place(tiles()); save(); renderGrid(); fillAdd();
  } catch (x) { alert(x.message); }
}

function fillAdd() {
  const T = tiles(), has = (ty, ref) => T.some(t => t.type === ty && t.ref === ref), o = [];
  if (tab === "home") {
    for (const r of ["network", "servers", "apps"]) if (!has("summary", r)) o.push([`s:${r}`, `${NAMES[r]} summary`]);
    for (const [id, a] of Object.entries(D.apps)) if (!has("app", id)) o.push([`a:${id}`, `App: ${a.name}`]);
  }
  if (tab === "network") { if (!has("summary", "network")) o.push(["s:network", "Network summary"]); o.push(["dev", "Device…"]); }
  if (tab === "apps") o.push(["app", "New app…"]);
  $("#add").innerHTML = `<option value="">+ Add tile</option>` + o.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("");
  $("#add").hidden = !edit || !o.length;
}

$("#add").onchange = e => {
  const v = e.target.value; e.target.value = "";
  if (!v) return;
  const n = {id: uid(), x: 0, y: 99, w: 3, h: 3};
  if (v.startsWith("s:")) Object.assign(n, {type: "summary", ref: v.slice(2), w: 4});
  else if (v.startsWith("a:")) Object.assign(n, {type: "app", ref: v.slice(2), w: 2, h: 2});
  else if (v === "dev") Object.assign(n, {type: "device", ref: "", new: true, w: 12, h: 4});
  else Object.assign(n, {type: "app", ref: uid(), new: true, w: 2, h: 2});
  tiles().push(n); place(tiles()); renderGrid(); fillAdd(); save();
  if (n.new) openCfg(n, els[tab + n.id]);
};

// ---- data ----
function sync() {  // one tile per device on the Network tab, new devices land at the bottom
  const names = DATA.devices.map(d => d.name), before = JSON.stringify(D.tabs.network);
  D.tabs.network.filter(t => t.type === "device" && !t.new && !names.includes(t.ref)).forEach(t => kill("network", t));
  const T = D.tabs.network;
  if (!T.some(t => t.new)) names.forEach(n => { if (!T.some(t => t.type === "device" && t.ref === n)) T.push({id: uid(), type: "device", ref: n, x: 0, y: 99, w: 12, h: 4}); });
  place(T);
  if (JSON.stringify(T) !== before) save();
}

async function load() {
  try {
    const r = await api("GET", `/api/data?minutes=${$("#range").value}`);
    DATA = r; iv = r.interval; $("#ver").textContent = "Version " + r.version;
    if (document.activeElement !== $("#iv")) $("#iv").value = iv;
    sync(); renderGrid();
    $("#stamp").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) { $("#stamp").textContent = "Can't reach the server. Retrying…"; }
  clearTimeout(timer); timer = setTimeout(load, iv * 1000);
}

function setTab(k) {
  tab = TABS.includes(k) ? k : "home";
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.t === tab ? "page" : "false"));
  renderGrid(); fillAdd();
}

function setTheme(mode, rebuild) {
  if (mode === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = mode;
  Chart.defaults.color = g("--mute"); Chart.defaults.borderColor = g("--grid");
  if (rebuild) {  // charts take their colors at creation, so rebuild the tiles
    for (const k in els) { els[k].ch?.use.destroy(); els[k].ch?.net.destroy(); els[k].remove(); delete els[k]; }
    renderGrid();
  }
}

$("#tabs").onclick = e => { const b = e.target.closest("button"); if (b) location.hash = b.dataset.t; };
addEventListener("hashchange", () => setTab(location.hash.slice(1)));
$("#edit").onclick = () => {
  edit = !edit; document.body.classList.toggle("editing", edit);
  $("#edit").textContent = edit ? "Done" : "Edit layout"; $("#edit").classList.toggle("pri", edit); fillAdd();
};
$("#save").onclick = () => api("POST", "/api/settings", {interval: +$("#iv").value}).then(load).catch(x => alert(x.message));
$("#range").onchange = load;
$("#bands").onchange = e => { bandsOn = e.target.checked; lsSet("bands", bandsOn ? "1" : "0"); renderGrid(); };
$("#theme").onchange = e => { lsSet("theme", e.target.value); setTheme(e.target.value, true); };
matchMedia("(prefers-color-scheme: dark)").onchange = () => { if ($("#theme").value === "auto") setTheme("auto", true); };
document.addEventListener("click", e => { const s = $("#settings"); if (s.open && !s.contains(e.target)) s.open = false; });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#settings").open = false; });

(async function init() {
  try { D = await api("GET", "/api/dash"); } catch { D = {}; }
  const fresh = !D.tabs;
  D.apps ||= {}; D.tabs ||= {};
  TABS.forEach(k => D.tabs[k] ||= DEF[k] ? DEF[k]() : []);
  bandsOn = lsGet("bands") === "1"; $("#bands").checked = bandsOn;
  const th = lsGet("theme") || "auto"; $("#theme").value = th; setTheme(th, false);
  if (fresh) save();
  setTab(location.hash.slice(1));
  load();
})();
</script></body></html>

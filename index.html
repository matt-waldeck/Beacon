<script>try{var d=document.documentElement,s=localStorage.getItem("style"),t=localStorage.getItem("theme");if(s)d.dataset.style=s;if(t&&t!=="auto")d.dataset.theme=t}catch(e){}</script>
<style>
:root{color-scheme:light;--r:20px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;--ink:#1d1d1f;--paper:#f5f5f7;--rule:rgba(0,0,0,.09);--grid:rgba(0,0,0,.06);--field:#fff;--blue:#0071e3;--on-blue:#fff;--amber:#ff9f0a;--red:#d70015;--ok:#248a3d;--mute:#6e6e73;--sh:inset 0 1px 0 var(--hi),inset 0 0 0 1px var(--hi2),0 1px 1px rgba(0,0,0,.05),0 14px 34px rgba(0,0,0,.10);--glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.4);--hi:rgba(255,255,255,.85);--hi2:rgba(255,255,255,.45);--w1:#cfe6ff;--w2:#ffdcea;--w3:#d8f3e3}

:root[data-style="stark"]{color-scheme:dark;--r:2px;--font:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--ink:#d8f6ff;--paper:#04080d;--rule:rgba(25,211,255,.3);--grid:rgba(25,211,255,.1);--field:rgba(6,16,26,.85);--blue:#19d3ff;--on-blue:#021018;--amber:#ff9f2e;--red:#ff4d5e;--ok:#2dffa0;--mute:#6fa8bd;--sh:0 0 18px rgba(25,211,255,.12),inset 0 0 24px rgba(25,211,255,.05);--glass:var(--field);--glass2:rgba(25,211,255,.05);--hi:transparent;--hi2:transparent}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(60rem 40rem at 10% -10%,var(--w1),transparent 60%),radial-gradient(50rem 40rem at 95% 5%,var(--w2),transparent 55%),radial-gradient(60rem 50rem at 60% 110%,var(--w3),transparent 55%),var(--paper);background-attachment:fixed;color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}

<body><main>
<header><h1>Homelab</h1>
<nav id="tabs"><button data-t="home">Home</button><button data-t="network">Network</button><button data-t="servers">Servers</button><button data-t="apps">Apps</button></nav>
<div class="ctl"><span id="stamp"></span>
<select id="add" hidden></select>
<button id="edit">Edit layout</button>
<details id="settings"><summary>Settings</summary>
<div class="menu">
<div class="row"><label>Network checks every <input id="iv" type="number" min="5" max="3600"> s</label><button id="save" class="pri">Save</button></div>
<div class="row"><label>Server pings every <input id="siv" type="number" min="5" max="3600"> s</label><button id="ssave" class="pri">Save</button></div>
<label>Show last <select id="range"><option value="15">15 minutes</option><option value="60" selected>1 hour</option><option value="360">6 hours</option><option value="1440">24 hours</option></select></label>
<label>Style <select id="style"><option value="honeycrisp">Honeycrisp</option><option value="stark">Stark</option></select></label>
<label>Mode <select id="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
<label class="chk"><input type="checkbox" id="bands"> Split client counts by band (2.4 / 5 / 6 GHz)</label>
<small id="ver" class="mute"></small>
</div></details></div></header>
<p id="none" class="mute" hidden></p>
<div id="grid"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const COLS = 12, TABS = ["home", "network", "servers", "apps"], BANDS = ["2.4", "5", "6"];
const NAMES = {network: "Network", servers: "Servers", apps: "Apps"};
const FIELDS = {app: [["name", "Name"], ["url", "URL (https://…)"], ["icon", "Icon: blank = look up by name, or an emoji / image URL"]]};
const SZ = {stat: [3, 2], chart: [4, 3], summary: [4, 3], list: [12, 8], app: [2, 2]};
const CAT = {  // key: [menu group, label, tile type]
  "n.online": ["Network", "Devices online", "stat"], "n.clients": ["Network", "Clients", "stat"], "n.poe": ["Network", "PoE draw", "stat"],
  "n.rx": ["Network", "Throughput received", "stat"], "n.tx": ["Network", "Throughput sent", "stat"], "n.cpu": ["Network", "Average CPU", "stat"],
  "n.mem": ["Network", "Average memory", "stat"], "n.load": ["Network", "Highest load", "stat"], "n.up": ["Network", "Longest uptime", "stat"],
  "n.c.net": ["Network charts", "Throughput", "chart"], "n.c.use": ["Network charts", "CPU and memory", "chart"],
  "n.c.clients": ["Network charts", "Clients", "chart"], "n.c.poe": ["Network charts", "PoE draw", "chart"],
  "s.online": ["Servers", "Servers online", "stat"], "s.avg": ["Servers", "Average ping", "stat"], "s.max": ["Servers", "Slowest ping", "stat"],
  "s.c.ping": ["Server charts", "Ping", "chart"], "a.count": ["Apps", "Apps", "stat"],
};
const SUMK = {network: ["n.online", "n.clients", "n.poe", "n.rx", "n.tx"], servers: ["s.online", "s.avg", "s.max"], apps: ["a.count"]};
const uid = () => Math.random().toString(36).slice(2, 8);
const T = (type, ref, x, y, w, h) => ({id: uid(), type, ref, x, y, w, h});
const DEF = {
  home: () => [T("summary", "network", 0, 0, 6, 3), T("summary", "servers", 6, 0, 3, 3), T("summary", "apps", 9, 0, 3, 3)],
  network: () => [T("stat", "n.online", 0, 0, 3, 3), T("stat", "n.clients", 3, 0, 3, 3), T("chart", "n.c.net", 6, 0, 3, 3), T("stat", "n.poe", 9, 0, 3, 3), T("list", "devices", 0, 3, 12, 8)],
  servers: () => [T("stat", "s.online", 0, 0, 3, 3), T("stat", "s.avg", 3, 0, 3, 3), T("stat", "s.max", 6, 0, 3, 3), T("chart", "s.c.ping", 9, 0, 3, 3), T("list", "servers", 0, 3, 12, 8)],
};
let D = {}, DATA = {devices: []}, SERV = {servers: []}, tab = "home", edit = false, iv = 30, siv = 15, timer, stimer, st, bandsOn = false;
const els = {};
const tiles = () => D.tabs[tab] ||= [];
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const esc = t => String(t ?? "–").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const g = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const bps = b => b >= 1e6 ? (b / 1e6).toFixed(1) + " Mbps" : Math.round(b / 1e3) + " kbps";
const pct = v => v + "%", W = v => v.toFixed(1) + " W", MS = v => v.toFixed(1) + " ms", PC = v => Math.round(v) + "%";
const up = s => { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}d ${h}h` : `${h}h ${m}m`; };
const lab = ts => new Date(ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});

async function api(method, url, body) {
  const r = await fetch(url, {method, headers: {"Content-Type": "application/json"}, body: body && JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Request failed");
  return j;
}
const clean = () => ({v: D.v, apps: D.apps, tabs: Object.fromEntries(Object.entries(D.tabs).map(([k, v]) => [k, v.filter(t => !t.new)]))});
const save = () => { clearTimeout(st); st = setTimeout(() => api("PUT", "/api/dash", clean()).catch(() => {}), 300); };

// ---- grid: 12 columns, tiles fall upward until they rest on another tile ----
const hit = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
function place(list, pin) {
  const done = pin ? [pin] : [];
  list.filter(t => t !== pin).sort((a, b) => a.y - b.y || a.x - b.x).forEach(t => {
    while (done.some(o => hit(o, t))) t.y++;
    while (t.y > 0 && !done.some(o => hit(o, {...t, y: t.y - 1}))) t.y--;
    done.push(t);
  });
}
function drag(e, t, el, mode) {
  if (e.button) return;
  e.preventDefault();
  const gr = $("#grid"), cw = (gr.getBoundingClientRect().width + 12) / COLS, ox = e.clientX, oy = e.clientY, o = {x: t.x, y: t.y, w: t.w, h: t.h};
  const ghost = document.createElement("div"); ghost.className = "ghost"; gr.append(ghost);
  const show = p => { ghost.style.gridColumn = `${p.x + 1} / span ${p.w}`; ghost.style.gridRow = `${p.y + 1} / span ${p.h}`; };
  let p = {...o}; show(p);
  if (mode === "move") el.classList.add("lift");
  const mv = ev => {
    const dx = Math.round((ev.clientX - ox) / cw), dy = Math.round((ev.clientY - oy) / 72);
    p = mode === "move" ? {...o, x: Math.max(0, Math.min(COLS - o.w, o.x + dx)), y: Math.max(0, o.y + dy)}
                        : {...o, w: Math.max(2, Math.min(COLS - o.x, o.w + dx)), h: Math.max(2, o.h + dy)};
    show(p);
    if (mode === "move") el.style.transform = `translate(${ev.clientX - ox}px, ${ev.clientY - oy}px)`;
  };
  addEventListener("pointermove", mv);
  addEventListener("pointerup", () => { removeEventListener("pointermove", mv); ghost.remove(); Object.assign(t, p); place(tiles(), t); save(); renderGrid(); }, {once: true});
}

// ---- tracked values: every stat/chart tile reads from these ----
const live = () => DATA.devices.filter(d => d.series.at(-1) && !d.series.at(-1).error);
const vals = f => live().map(d => d.series.at(-1)[f]).filter(x => x != null);
const sum = a => a.length ? a.reduce((x, y) => x + y, 0) : null;
const avg = a => a.length ? sum(a) / a.length : null;
const mx = a => a.length ? Math.max(...a) : null;
const fm = (f, v) => v == null ? null : f(v);
const lat = () => SERV.servers.map(s => s.series.at(-1)).filter(Boolean);
const pings = () => lat().map(x => x.ms).filter(x => x != null);
const split = () => {
  if (!bandsOn) return "";
  const b = {};
  live().forEach(d => { for (const k in d.series.at(-1).bands) b[k] = (b[k] ?? 0) + d.series.at(-1).bands[k]; });
  return BANDS.filter(k => b[k] != null).map(k => `${k} GHz ${b[k]}`).join(" · ");
};
const STAT = {  // each returns [value or null, detail line]
  "n.online": () => [`${live().length} of ${DATA.devices.length}`], "n.clients": () => [sum(vals("clients")), split()],
  "n.poe": () => [fm(W, sum(vals("poe")))], "n.rx": () => [fm(bps, sum(vals("rx")))], "n.tx": () => [fm(bps, sum(vals("tx")))],
  "n.cpu": () => [fm(PC, avg(vals("cpu")))], "n.mem": () => [fm(PC, avg(vals("mem")))],
  "n.load": () => [fm(v => v.toFixed(2), mx(vals("load")))], "n.up": () => [fm(up, mx(vals("uptime")))],
  "s.online": () => [`${lat().filter(x => x.ms != null).length} of ${SERV.servers.length}`],
  "s.avg": () => [fm(MS, avg(pings()))], "s.max": () => [fm(MS, mx(pings()))], "a.count": () => [Object.keys(D.apps).length],
};
function agg(lists, field, how, bs) {  // combine one field across devices into a time series
  const m = new Map();
  for (const s of lists) for (const x of s) {
    if (x.error || x[field] == null) continue;
    const k = Math.round(x.ts / bs), a = m.get(k) || {ts: x.ts, v: []};
    a.v.push(x[field]); m.set(k, a);
  }
  const f = {sum: a => a.reduce((p, c) => p + c, 0), avg: a => a.reduce((p, c) => p + c, 0) / a.length}[how];
  return [...m].sort((a, b) => a[0] - b[0]).map(([, a]) => ({ts: a.ts, v: f(a.v)}));
}
const NET = () => DATA.devices.map(d => d.series), SRV = () => SERV.servers.map(s => s.series);
const CHART = {
  "n.c.net": () => ({sets: [["Received", "--blue", agg(NET(), "rx", "sum", iv)], ["Sent", "--amber", agg(NET(), "tx", "sum", iv)]], fmt: bps}),
  "n.c.use": () => ({sets: [["CPU", "--blue", agg(NET(), "cpu", "avg", iv)], ["Memory", "--amber", agg(NET(), "mem", "avg", iv)]], fmt: pct, max: 100}),
  "n.c.clients": () => ({sets: [["Clients", "--blue", agg(NET(), "clients", "sum", iv)]], fmt: v => Math.round(v)}),
  "n.c.poe": () => ({sets: [["PoE draw", "--blue", agg(NET(), "poe", "sum", iv)]], fmt: W}),
  "s.c.ping": () => ({sets: [["Average ping", "--blue", agg(SRV(), "ms", "avg", siv)]], fmt: MS}),
};
const tot = (key, dash) => {
  const [v, d] = STAT[key]();
  return v == null && !dash ? "" : `<div class="tot"><small>${CAT[key][1]}</small><b>${v ?? "–"}</b>${d ? `<small>${esc(d)}</small>` : ""}</div>`;
};

// ---- tiles ----
const mk = (el, sets, max, fmt) => new Chart(el, {type: "line",
  data: {labels: [], datasets: sets.map(([label, c]) => ({label, borderColor: c, borderWidth: 1.5, pointRadius: 0, tension: .25, data: []}))},
  options: {animation: false, maintainAspectRatio: false, interaction: {mode: "index", intersect: false},
    scales: {x: {ticks: {maxTicksLimit: 5}}, y: {beginAtZero: true, max, ticks: {callback: fmt}}},
    plugins: {legend: {labels: {boxWidth: 10}}, tooltip: {callbacks: {label: c => `${c.dataset.label}: ${fmt(c.parsed.y)}`}}}}});
const upd = (c, labels, ...sets) => { c.data.labels = labels; sets.forEach((s, i) => c.data.datasets[i].data = s); c.update(); };

const slug = n => n.toLowerCase().trim().replace(/\s+/g, "-").replace(/[^a-z0-9-]/g, "");
function icon(a) {  // emoji as-is, URL as image, blank = look the app up by name (Dashboard Icons, then selfh.st), else its first letter
  const span = document.createElement("span"), ic = (a.icon || "").trim(), s = slug(a.name || "");
  span.className = "ic";
  const letter = () => { span.textContent = (a.name || "?")[0]; };
  if (ic && !/^https?:\/\//i.test(ic)) { span.textContent = ic; return span; }
  const c = ic ? [ic] : s ? [`https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/${s}.svg`, `https://cdn.jsdelivr.net/gh/selfhst/icons/png/${s}.png`] : [];
  if (!c.length) { letter(); return span; }
  const img = new Image(); let i = 0;
  img.alt = ""; img.src = c[0];
  img.onerror = () => ++i < c.length ? (img.src = c[i]) : (img.remove(), letter());
  span.append(img); return span;
}

const bandRows = b => bandsOn && b ? BANDS.filter(k => b[k] != null).map(k => `<dt class="sub">${k} GHz</dt><dd>${b[k]}</dd>`).join("") : "";
function devFacts(d) {
  const s = d.series, last = s.at(-1) || {}, info = [...s].reverse().find(x => x.model) || {};
  if (!s.length) return "<p>Waiting for first sample…</p>";
  if (last.error) return `<p class="bad">Unreachable: ${esc(last.error)}</p>`;
  return `<dl><dt>Model</dt><dd>${esc(info.model)}</dd><dt>Firmware</dt><dd>${esc(info.version)}</dd>
    <dt>Uptime</dt><dd>${last.uptime ? up(last.uptime) : "–"}</dd>${last.clients != null ? `<dt>Clients</dt><dd>${last.clients}</dd>` + bandRows(last.bands) : ""}
    <dt>Load</dt><dd>${esc(last.load)}</dd>${last.poe != null ? `<dt>PoE draw</dt><dd>${last.poe} W</dd>` : ""}</dl>`;
}
function srvFacts(s) {
  const ok = s.series.filter(x => x.ms != null), l = s.series.at(-1), n = s.series.length;
  return `<dl><dt>Status</dt><dd>${!l ? "–" : l.ms != null ? "Online" : "Offline"}</dd><dt>Ping</dt><dd>${l?.ms != null ? MS(l.ms) : "–"}</dd>
    <dt>Average</dt><dd>${ok.length ? MS(avg(ok.map(x => x.ms))) : "–"}</dd><dt>Worst</dt><dd>${ok.length ? MS(mx(ok.map(x => x.ms))) : "–"}</dd>
    <dt>Loss</dt><dd>${n ? Math.round(100 * (1 - ok.length / n)) + "%" : "–"}</dd></dl>`;
}

// UniFi-style lists: one row per item, click a row for the details and graphs
const LIST = {
  devices: {title: "Devices", add: "+ Add device", head: ["Name", "IP", "Clients", "Load"], items: () => DATA.devices,
    cells: d => { const l = d.series.at(-1), good = l && !l.error, info = [...d.series].reverse().find(x => x.model) || {};
      return {sub: info.model || "", ok: l ? !l.error : null, c: [d.host, good && l.clients != null ? l.clients : "–", good && l.load != null ? l.load : "–"]}; },
    html: `<div class="dev"><div class="f"></div><div class="ch"><canvas></canvas></div><div class="ch"><canvas></canvas></div></div>`,
    mkc: cs => [mk(cs[0], [["CPU", g("--blue")], ["Memory", g("--amber")]], 100, pct), mk(cs[1], [["Received", g("--blue")], ["Sent", g("--amber")]], undefined, bps)],
    fill: (r, d) => {
      if (!d) return;
      const ok = d.series.filter(x => !x.error), lb = ok.map(x => lab(x.ts));
      r.li.querySelector(".f").innerHTML = devFacts(d);
      if (r.charts) { upd(r.charts[0], lb, ok.map(x => x.cpu), ok.map(x => x.mem)); upd(r.charts[1], lb, ok.map(x => x.rx), ok.map(x => x.tx)); }
    }},
  servers: {title: "Servers", add: "+ Add server", head: ["Name", "IP", "Status", "Ping"], items: () => SERV.servers,
    cells: s => { const l = s.series.at(-1);
      return {sub: "", ok: l ? l.ms != null : null, c: [s.host, l ? (l.ms != null ? "Online" : "Offline") : "–", l && l.ms != null ? MS(l.ms) : "–"]}; },
    html: `<div class="dev two"><div class="f"></div><div class="ch"><canvas></canvas></div></div>`,
    mkc: cs => [mk(cs[0], [["Ping", g("--blue")]], undefined, MS)],
    fill: (r, s) => {
      if (!s) return;
      r.li.querySelector(".f").innerHTML = srvFacts(s);
      if (r.charts) upd(r.charts[0], s.series.map(x => lab(x.ts)), s.series.map(x => x.ms));
    }},
};

function itemForm(kind, item, mount) {
  mount.innerHTML = `<form class="fm2"><input name="name" placeholder="Name" required maxlength="60" value="${esc(item?.name ?? "")}"><input name="host" placeholder="IP or hostname" required value="${esc(item?.host ?? "")}"><button class="pri">${item ? "Save" : "Add"}</button><button type="button" class="x">Cancel</button><span class="err"></span></form>`;
  const f = mount.firstChild;
  f.onsubmit = async e => {
    e.preventDefault();
    try {
      await api(item ? "PUT" : "POST", `/api/${kind}` + (item ? "/" + encodeURIComponent(item.name) : ""), Object.fromEntries(new FormData(f)));
      mount.innerHTML = ""; refresh(); setTimeout(refresh, 5000);
    } catch (x) { f.querySelector(".err").textContent = x.message; }
  };
  f.querySelector(".x").onclick = () => mount.innerHTML = "";
  f.elements[0].focus();
}

function mkRow(t, name) {
  const K = LIST[t.ref], li = document.createElement("div"), r = {li, open: false}, q = s => li.querySelector(s);
  li.className = "li";
  li.innerHTML = `<button class="lr" aria-expanded="false"><span class="nm"><i class="dot"></i><b></b><small></small></span><span class="c1"></span><span class="c2"></span><span class="c3"></span><i class="chev">›</i></button><div class="ld" hidden>${K.html}<p class="acts"><button class="ed">Edit</button><button class="rmv">Remove</button></p><div class="fm"></div></div>`;
  const item = () => K.items().find(x => x.name === name);
  q(".lr").onclick = () => {
    r.open = !r.open; q(".lr").setAttribute("aria-expanded", r.open); q(".ld").hidden = !r.open;
    if (r.open) { r.charts ||= K.mkc([...li.querySelectorAll("canvas")]); K.fill(r, item()); }
    else { r.charts?.forEach(c => c.destroy()); r.charts = null; }
  };
  q(".ed").onclick = () => itemForm(t.ref, item(), q(".fm"));
  q(".rmv").onclick = async () => {
    if (!confirm(`Remove ${name}${t.ref === "devices" ? " and its history" : ""}?`)) return;
    try { await api("DELETE", `/api/${t.ref}/${encodeURIComponent(name)}`); refresh(); } catch (x) { alert(x.message); }
  };
  return r;
}
function renderList(t, el) {
  const K = LIST[t.ref], src = K.items(), rows = el.rows ||= {}, box = el.querySelector(".items");
  for (const n in rows) if (!src.some(x => x.name === n)) { rows[n].charts?.forEach(c => c.destroy()); rows[n].li.remove(); delete rows[n]; }
  src.forEach(x => {
    const r = rows[x.name] ||= mkRow(t, x.name), c = K.cells(x), q = s => r.li.querySelector(s);
    if (r.li.parentNode !== box) box.append(r.li);
    q(".dot").className = "dot " + (c.ok === null ? "" : c.ok ? "up" : "down");
    q(".nm b").textContent = x.name; q(".nm small").textContent = c.sub;
    c.c.forEach((v, i) => q(".c" + (i + 1)).textContent = v);
    if (r.open) K.fill(r, x);
  });
  el.querySelector(".none2").hidden = src.length > 0;
}

function build(t) {
  const el = document.createElement("section");
  el.className = "tile t-" + t.type; el.dataset.k = tab + t.id;
  el.innerHTML = `<div class="th"><span class="title"></span><span class="tb"><button class="mv" aria-label="Move">⠿</button><button class="cf" aria-label="Configure">⚙</button><button class="rm" aria-label="Remove">✕</button></span></div><div class="body"></div><i class="rs"></i><form class="cfg" hidden></form>`;
  el.body = el.querySelector(".body"); el.ttl = el.querySelector(".title");
  if (t.type === "chart") {
    el.body.innerHTML = `<div class="ch"><canvas></canvas></div>`;
    const sp = CHART[t.ref]();
    el.charts = [mk(el.body.querySelector("canvas"), sp.sets.map(([l, c]) => [l, g(c)]), sp.max, sp.fmt)];
  }
  if (t.type === "app") el.body.innerHTML = `<a class="app" target="_blank" rel="noopener"><span class="ic"></span><b></b></a>`;
  if (t.type === "list") {
    const K = LIST[t.ref], add = document.createElement("button");
    el.body.innerHTML = `<div class="addfm"></div><div class="lh"><span>${K.head[0]}</span><span>${K.head[1]}</span><span>${K.head[2]}</span><span>${K.head[3]}</span><span></span></div><div class="items"></div><p class="mute none2" style="padding:.9rem" hidden>Nothing here yet. Use ${K.add} to add one.</p>`;
    add.className = "add"; add.textContent = K.add;
    add.onclick = () => itemForm(t.ref, null, el.querySelector(".addfm"));
    el.querySelector(".th").insertBefore(add, el.querySelector(".tb"));
  }
  el.querySelector(".th").onpointerdown = e => edit && !e.target.closest(".cf,.rm,.add") && drag(e, t, el, "move");
  el.querySelector(".rs").onpointerdown = e => drag(e, t, el, "size");
  el.querySelector(".cf").onclick = () => openCfg(t, el);
  el.querySelector(".rm").onclick = () => remove(t);
  if (!FIELDS[t.type]) el.querySelector(".cf").hidden = true;
  return el;
}

function update(t, el) {
  if (t.type === "stat") el.body.innerHTML = tot(t.ref, true), el.ttl.textContent = CAT[t.ref][1];
  else if (t.type === "summary") { el.ttl.textContent = NAMES[t.ref]; el.body.innerHTML = `<div class="sum">${SUMK[t.ref].map(k => tot(k)).join("")}</div>`; }
  else if (t.type === "chart") {
    const sp = CHART[t.ref]();
    el.ttl.textContent = CAT[t.ref][1];
    upd(el.charts[0], sp.sets[0][2].map(p => lab(p.ts)), ...sp.sets.map(s => s[2].map(p => p.v)));
  } else if (t.type === "list") { el.ttl.textContent = LIST[t.ref].title; renderList(t, el); }
  else if (t.type === "app") {
    const a = D.apps[t.ref] || {}, l = el.body.firstChild, k = JSON.stringify(a);
    el.ttl.textContent = l.children[1].textContent = a.name || "New app";
    if (el.ik !== k) {
      el.ik = k;
      if (/^https?:\/\//i.test(a.url || "")) l.href = a.url; else l.removeAttribute("href");
      l.children[0].replaceWith(icon(a));
    }
  }
}

const wipe = el => { el.charts?.forEach(c => c.destroy()); Object.values(el.rows || {}).forEach(r => r.charts?.forEach(c => c.destroy())); el.remove(); };
function kill(k, x) {  // remove tile x from tab k
  if (els[k + x.id]) { wipe(els[k + x.id]); delete els[k + x.id]; }
  D.tabs[k] = D.tabs[k].filter(y => y !== x);
}
function renderGrid() {
  const gr = $("#grid"), list = tiles(), keep = new Set(list.map(t => tab + t.id));
  gr.querySelectorAll(".tile").forEach(c => keep.has(c.dataset.k) || c.remove());
  list.forEach(t => {
    const el = els[tab + t.id] ||= build(t);
    el.style.gridColumn = `${t.x + 1} / span ${t.w}`; el.style.gridRow = `${t.y + 1} / span ${t.h}`;
    el.style.transform = ""; el.classList.remove("lift");
    if (el.parentNode !== gr) gr.append(el);
    update(t, el);
  });
  $("#none").hidden = list.length > 0;
  $("#none").textContent = "Nothing here yet. Choose Edit layout, then + Add tile.";
}

// ---- in-place configuration (apps) ----
function openCfg(t, el) {
  const f = el.querySelector("form"), cur = D.apps[t.ref] || {};
  f.innerHTML = FIELDS[t.type].map(([k, l]) => `<label>${l}<input name="${k}" value="${esc(cur[k] ?? "")}"></label>`).join("")
    + `<div><button class="pri">Save</button> <button type="button" class="x">Cancel</button></div>`;
  f.hidden = false;
  f.onsubmit = e => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(f));
    D.apps[t.ref] = {name: v.name.trim() || "App", url: v.url.trim(), icon: v.icon.trim()};
    delete t.new; f.hidden = true; save(); fillAdd(); renderGrid();
  };
  f.querySelector(".x").onclick = () => { f.hidden = true; if (t.new) remove(t); };
  f.elements[0].focus();
}
function remove(t) {
  if (t.type === "app" && tab === "apps") {  // the Apps tab is the catalog: removing here removes it everywhere
    if (!t.new && !confirm(`Remove ${D.apps[t.ref]?.name} from every tab?`)) return;
    for (const k in D.tabs) D.tabs[k].filter(x => x.type === "app" && x.ref === t.ref).forEach(x => kill(k, x));
    delete D.apps[t.ref];
  } else kill(tab, t);
  place(tiles()); save(); renderGrid(); fillAdd();
}
function fillAdd() {
  const list = tiles(), has = (ty, ref) => list.some(t => t.type === ty && t.ref === ref), groups = {};
  const add = (grp, v, l) => (groups[grp] ||= []).push([v, l]);
  for (const [k, [grp, label, ty]] of Object.entries(CAT)) if (!has(ty, k)) add(grp, `${ty}:${k}`, label);
  for (const r of ["network", "servers", "apps"]) if (!has("summary", r)) add("Overviews", `summary:${r}`, `${NAMES[r]} summary`);
  for (const r of ["devices", "servers"]) if (!has("list", r)) add("Lists", `list:${r}`, LIST[r].title + " list");
  for (const [id, a] of Object.entries(D.apps)) if (!has("app", id)) add("Apps", `app:${id}`, a.name);
  if (tab === "apps") add("Apps", "app:new", "New app…");
  $("#add").innerHTML = `<option value="">+ Add tile</option>` + Object.entries(groups).map(([gr, o]) => `<optgroup label="${esc(gr)}">${o.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("")}</optgroup>`).join("");
  $("#add").hidden = !edit;
}
$("#add").onchange = e => {
  const v = e.target.value, i = v.indexOf(":"), type = v.slice(0, i); e.target.value = "";
  if (!v) return;
  const n = {id: uid(), type, ref: v.slice(i + 1), x: 0, y: 99, w: SZ[type][0], h: SZ[type][1]};
  if (type === "app" && n.ref === "new") { n.ref = uid(); n.new = true; }
  tiles().push(n); place(tiles()); renderGrid(); fillAdd(); save();
  if (n.new) openCfg(n, els[tab + n.id]);
};

// ---- data ----
async function load() {
  try {
    DATA = await api("GET", `/api/data?minutes=${$("#range").value}`);
    iv = DATA.interval; siv = DATA.server_interval; $("#ver").textContent = "Version " + DATA.version;
    if (document.activeElement !== $("#iv")) $("#iv").value = iv;
    if (document.activeElement !== $("#siv")) $("#siv").value = siv;
    renderGrid();
    $("#stamp").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) { $("#stamp").textContent = "Can't reach the server. Retrying…"; }
  clearTimeout(timer); timer = setTimeout(load, iv * 1000);
}
async function loadS() {
  try { SERV = await api("GET", `/api/servers?minutes=${$("#range").value}`); siv = SERV.interval; renderGrid(); } catch (e) {}
  clearTimeout(stimer); stimer = setTimeout(loadS, siv * 1000);
}
const refresh = () => Promise.all([load(), loadS()]);

function setTab(k) {
  tab = TABS.includes(k) ? k : "home";
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.t === tab ? "page" : "false"));
  renderGrid(); fillAdd();
}
function applyTheme(rebuild) {
  const r = document.documentElement;
  r.dataset.style = $("#style").value;
  if ($("#theme").value === "auto") r.removeAttribute("data-theme"); else r.dataset.theme = $("#theme").value;
  $("#theme").disabled = $("#style").value === "stark";
  Chart.defaults.color = g("--mute"); Chart.defaults.borderColor = g("--grid"); Chart.defaults.font.family = g("--font");
  if (rebuild) {  // charts take their colors at creation, so rebuild the tiles
    for (const k in els) { wipe(els[k]); delete els[k]; }
    renderGrid();
  }
}

$("#tabs").onclick = e => { const b = e.target.closest("button"); if (b) location.hash = b.dataset.t; };
addEventListener("hashchange", () => setTab(location.hash.slice(1)));
$("#edit").onclick = () => {
  edit = !edit; document.body.classList.toggle("editing", edit);
  $("#edit").textContent = edit ? "Done" : "Edit layout"; $("#edit").classList.toggle("pri", edit); fillAdd();
};
const setIv = (id, key) => () => api("POST", "/api/settings", {[key]: +$(id).value}).then(refresh).catch(x => alert(x.message));
$("#save").onclick = setIv("#iv", "interval");
$("#ssave").onclick = setIv("#siv", "server_interval");
$("#range").onchange = refresh;
$("#bands").onchange = e => { bandsOn = e.target.checked; lsSet("bands", bandsOn ? "1" : "0"); renderGrid(); };
$("#style").onchange = () => { lsSet("style", $("#style").value); applyTheme(true); };
$("#theme").onchange = () => { lsSet("theme", $("#theme").value); applyTheme(true); };
matchMedia("(prefers-color-scheme: dark)").onchange = () => { if ($("#theme").value === "auto") applyTheme(true); };
document.addEventListener("click", e => { const s = $("#settings"); if (s.open && !s.contains(e.target)) s.open = false; });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#settings").open = false; });

(async function init() {
  try { D = await api("GET", "/api/dash"); } catch { D = {}; }
  const fresh = !D.tabs;
  D.apps ||= {}; D.tabs ||= {};
  TABS.forEach(k => D.tabs[k] ||= DEF[k] ? DEF[k]() : []);
  if (D.v !== "0.2") { D.tabs.network = DEF.network(); D.tabs.servers = DEF.servers(); D.v = "0.2"; save(); }  // 0.1 per-device tiles become the list layout
  else if (fresh) save();
  bandsOn = lsGet("bands") === "1"; $("#bands").checked = bandsOn;
  $("#style").value = lsGet("style") === "stark" ? "stark" : "honeycrisp"; $("#theme").value = lsGet("theme") || "auto";
  applyTheme(false);
  setTab(location.hash.slice(1));
  load(); loadS();
})();
</script></body></html>

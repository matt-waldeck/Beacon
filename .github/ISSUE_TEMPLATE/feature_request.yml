name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the feature or change. Screenshots and sketches are welcome.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What problem would it solve?
      description: Optional, but it helps to know what you're trying to do.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Filled in for you if you used Beacon's Feedback page and ticked the diagnostics box.
      render: text
